<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TARS DJ · cities after dark</title>
<meta name="description" content="TARS DJ — pixel nights around the world. 56 cities, one live stream." />
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <canvas id="screen" aria-label="City loop"></canvas>
  <header class="hud hud-city">
    <h1>TARS DJ <small>worldwide</small></h1>
    <nav class="hud-links">
      <span class="byline">powered by <a href="https://qvac.tether.io/" target="_blank" rel="noopener">QVAC</a> · <a href="https://github.com/fraserbrownirl/tars-dj" target="_blank" rel="noopener">open source</a></span>
    </nav>
  </header>
  <div class="controls">
    <div class="city-picker" id="cityPicker"></div>
    <div class="player">
      <button id="playBtn" type="button" aria-label="Play">▶ Stream</button>
      <button id="driftBtn" type="button" aria-label="Toggle drift">◐ drift on</button>
      <audio id="stream" preload="none"></audio>
      <span id="nowPlaying" aria-live="polite"></span>
      <span id="creditLine" aria-live="polite" hidden></span>
    </div>
    <form class="wish" id="wishForm" autocomplete="off">
      <div class="wish-row">
        <input
          id="wishInput"
          type="text"
          maxlength="120"
          placeholder="Tell the QVAC agents how the music should feel…"
          aria-label="Your wish for the music"
        />
        <button id="wishBtn" type="submit" aria-label="Send wish">↗</button>
      </div>
      <div class="wish-row wish-credit">
        <input
          id="wishName"
          type="text"
          maxlength="24"
          placeholder="name"
          aria-label="Your name for the on-air credit (optional)"
        />
        <input
          id="wishCountry"
          type="text"
          maxlength="56"
          placeholder="country or city"
          aria-label="Your country or city for the on-air credit (optional)"
        />
        <span class="wish-credit-hint">credited on air when your track plays</span>
        <span id="wishNote" aria-live="polite"></span>
      </div>
    </form>
  </div>
  <div class="tsmodal" id="tsModal" hidden>
    <div class="tsmodal-box" role="dialog" aria-modal="true" aria-labelledby="tsTitle">
      <p id="tsTitle">Quick check that you're human</p>
      <div id="tsWidget"></div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
